    body::before {
      content: '';
      position: fixed;
      top: 0; left: 0; right: 0;
      height: 220px;
      background: linear-gradient(to bottom, rgba(0,0,0,0.72) 0%, transparent 100%);
      pointer-events: none;
      z-index: 1;
    }

    #timer-wrapper {
      position: fixed;
      top: 32px;
      right: 48px;
      z-index: 10;
      display: flex;
      flex-direction: column;
      align-items: flex-end;
      gap: 6px;
    }

    #label {
      font-family: 'Bebas Neue', cursive;
      font-size: 22px;
      letter-spacing: 5px;
      color: rgba(255,255,255,0.75);
      text-shadow: 0 2px 8px rgba(0,0,0,0.8);
      text-transform: uppercase;
    }

    #timer {
      display: flex;
      gap: 18px;
      align-items: flex-end;
    }

    .unit {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 2px;
    }

    .digit {
      font-family: 'Orbitron', sans-serif;
      font-weight: 900;
      font-size: 42px;
      line-height: 1;
      color: #ffffff;
      text-shadow:
        0 0 20px rgba(44, 43, 36, 0.9),
        0 0 40px rgba(44, 43, 40, 0.5),
        0 2px 12px rgba(0,0,0,0.9);
      min-width: 2ch;
      text-align: center;
      transition: opacity 0.1s;
    }

    .unit-label {
      font-family: 'Bebas Neue', cursive;
      font-size: 15px;
      letter-spacing: 4px;
      color: rgba(214, 214, 214, 0.9);
      text-shadow: 0 1px 6px rgba(0,0,0,0.9);
    }

    .sep {
      font-family: 'Orbitron', sans-serif;
      font-weight: 900;
      font-size: 60px;
      color: rgba(255, 248, 229, 0.7);
      line-height: 1;
      padding-bottom: 16px;
      text-shadow: 0 0 12px rgba(32, 32, 31, 0.6);
      animation: blink 1s step-start infinite;
    }

    @keyframes blink {
      0%, 100% { opacity: 1; }
      50% { opacity: 0.2; }
    }

    /* Entrada animada */
    #timer-wrapper {
      animation: slideIn 0.8s cubic-bezier(0.22,1,0.36,1) both;
    }
    @keyframes slideIn {
      from { opacity: 0; transform: translateY(-30px); }
      to   { opacity: 1; transform: translateY(0); }
    }

    .digit.tick {
      animation: pulse 0.15s ease-out;
    }
    @keyframes pulse {
      0%   { transform: scale(1.08); }
      100% { transform: scale(1); }
    }
  </style>
</head>
<body>

  <div id="timer-wrapper">
   <!-- <div id="label">Contagem Regressiva - MED IV</div> -->
    <div id="timer">
      <div class="unit">
        <span class="digit" id="dd">00</span>
        <span class="unit-label">Dias</span>
      </div>
      <span class="sep">:</span>
      <div class="unit">
        <span class="digit" id="hh">00</span>
        <span class="unit-label">Horas</span>
      </div>
      <span class="sep">:</span>
      <div class="unit">
        <span class="digit" id="mm">00</span>
        <span class="unit-label">Min</span>
      </div>
      <span class="sep">:</span>
      <div class="unit">
        <span class="digit" id="ss">00</span>
        <span class="unit-label">Seg</span>
      </div>
    </div>
  </div>

  <script>
    const target = new Date('2026-12-10T00:00:00');

    function pad(n) { return String(n).padStart(2, '0'); }

    function tick(elId, val) {
      const el = document.getElementById(elId);
      const newVal = pad(val);
      if (el.textContent !== newVal) {
        el.classList.remove('tick');
        void el.offsetWidth; // reflow
        el.classList.add('tick');
        el.textContent = newVal;
      }
    }

    function update() {
      const now = new Date();
      const diff = target - now;

      if (diff <= 0) {
        document.getElementById('label').textContent = '🎓 Chegou o grande dia!';
        ['dd','hh','mm','ss'].forEach(id => document.getElementById(id).textContent = '00');
        return;
      }

      const d = Math.floor(diff / 86400000);
      const h = Math.floor((diff % 86400000) / 3600000);
      const m = Math.floor((diff % 3600000) / 60000);
      const s = Math.floor((diff % 60000) / 1000);

      tick('dd', d);
      tick('hh', h);
      tick('mm', m);
      tick('ss', s);
    }

    update();
    setInterval(update, 1000);
  </script>
</body>
</html>
